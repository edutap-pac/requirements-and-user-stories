[project]
name = "edutap-pac-requirements"
version = "0.1.0"
description = "Requirements, specification and user stories for eduTAP PAC"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "EUPL-1.2" }

[project.optional-dependencies]
docs = [
    "sphinx>=8.1",
    "myst-parser[linkify]>=4.0",
    "furo>=2024.8.6",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.1",
    "sphinxcontrib-mermaid>=1.0",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
