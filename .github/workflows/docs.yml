name: Documentation

# Builds the Sphinx documentation on every push and pull request, and
# publishes it to GitHub Pages from the default branch.
#
# Publishing is gated on the repository variable PUBLISH_DOCS. GitHub Pages
# is unavailable for private repositories on the Free plan, so the deploy
# job stays inert until the repository is public and Pages is enabled with
# "GitHub Actions" as its source. Set the variable with:
#
#   gh variable set PUBLISH_DOCS --body true
#
# Until then every run still uploads the built site as a workflow artifact,
# so reviewers can download and open it locally.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Build the documentation
        run: make html

      - name: Check external links
        run: make linkcheck
        continue-on-error: true

      - name: Disable Jekyll processing
        run: touch docs/_build/html/.nojekyll

      - name: Upload the site for review
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/_build/html
          retention-days: 14

      - name: Upload the site for GitHub Pages
        if: github.ref == 'refs/heads/main' && vars.PUBLISH_DOCS == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/main' && vars.PUBLISH_DOCS == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
